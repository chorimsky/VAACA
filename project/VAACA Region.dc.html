<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://api.fontshare.com/v2/css?f[]=general-sans@400,500,600,700&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&display=swap" rel="stylesheet" />
<script src="./image-slot.js"></script>
<style> html { scroll-behavior: smooth; } body { margin: 0; } a { color: #0E2A44; } a:hover { color: #1AA6B3; } .vaaca-serif { font-family:'Source Serif 4',Georgia,serif; } </style>
</helmet>
<div id="top" style="font-family:'General Sans',ui-sans-serif,system-ui,sans-serif; color:#33393E; background:#FAFAF8;">
  <div style="height:3px; background:linear-gradient(90deg,#0E2A44,#1AA6B3,#B5730C);"></div>
  <dc-import name="VAACA Nav" active="region" hint-size="100%,72px"></dc-import>

  <div style="background:#0E2A44; padding:56px 32px 68px;">
    <div style="max-width:1180px; margin:0 auto;">
      <div style="font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:0.14em; text-transform:uppercase; color:#1AA6B3; margin-bottom:10px;">Region</div>
      <h1 class="vaaca-serif" style="font-size:32px; font-weight:600; max-width:720px; line-height:1.3; margin:0 0 30px; color:#fff;">One region. Multiple markets. A shared institutional architecture.</h1>
      <div style="background:#fff; border-radius:14px; padding:6px; margin-bottom:20px;">
        <image-slot id="region-map" shape="rounded" radius="10" placeholder="CEMAC regional map" style="width:100%; height:210px;"></image-slot>
      </div>
      <div style="display:grid; grid-template-columns:repeat(6,minmax(0,1fr)); gap:12px;">
        <sc-for list="{{ cemacStates }}" as="state" hint-placeholder-count="6">
          <a href="{{ state.href }}" target="_blank" rel="noopener" style="display:block; border:1px solid {{ state.borderColor }}; border-radius:12px; padding:14px; text-decoration:none;" style-hover="border-color:#1AA6B3;">
            <div style="font-weight:700; font-size:13px; color:#fff;">{{ state.name }}</div>
            <div style="font-size:10.5px; font-weight:600; color:{{ state.statusColor }}; margin-top:6px;">{{ state.status }}</div>
          </a>
        </sc-for>
      </div>
    </div>
  </div>

  <dc-import name="VAACA Footer" hint-size="100%,320px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  cemacStates = [
    { name: 'Cameroon', status: 'Founding chapter', statusColor: '#5FE0E0', borderColor: '#1AA6B3', href: './CAVAA Operating System.dc.html' },
    { name: 'Gabon', status: 'Pending', statusColor: '#A9B7C2', borderColor: 'rgba(255,255,255,0.16)', href: './VAACA Chapter - Gabon.dc.html' },
    { name: 'Congo', status: 'Pending', statusColor: '#A9B7C2', borderColor: 'rgba(255,255,255,0.16)', href: './VAACA Chapter - Congo.dc.html' },
    { name: 'Chad', status: 'Pending', statusColor: '#A9B7C2', borderColor: 'rgba(255,255,255,0.16)', href: './VAACA Chapter - Chad.dc.html' },
    { name: 'C.A.R.', status: 'Pending', statusColor: '#A9B7C2', borderColor: 'rgba(255,255,255,0.16)', href: './VAACA Chapter - CAR.dc.html' },
    { name: 'Eq. Guinea', status: 'Pending', statusColor: '#A9B7C2', borderColor: 'rgba(255,255,255,0.16)', href: './VAACA Chapter - Eq Guinea.dc.html' },
  ];
  renderVals() { return { cemacStates: this.cemacStates }; }
}
</script>
</body>
</html>
