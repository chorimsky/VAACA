<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
  .vaaca-hamburger { display: none; }
  @media (max-width: 880px) {
    .vaaca-navlinks { display: none !important; }
    .vaaca-hamburger { display: flex !important; }
  }
  a:focus-visible, button:focus-visible { outline: 2px solid #1AA6B3; outline-offset: 2px; }
</style>
</helmet>
<div style="font-family:'General Sans',ui-sans-serif,system-ui,sans-serif; {{ navBarStyle }}">
  <div style="max-width:1180px; margin:0 auto; padding:16px 32px; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:16px;">
    <a href="./CAVAA Landing Page.dc.html" style="display:flex; align-items:center; gap:12px; text-decoration:none;">
      <svg width="36" height="36" viewBox="0 0 40 40" fill="none">
        <circle cx="20" cy="20" r="18.5" stroke="#B5730C" stroke-width="1" opacity="0.4"></circle>
        <line x1="20" y1="20" x2="8" y2="8" stroke="#1AA6B3" stroke-width="1.6"></line>
        <line x1="20" y1="20" x2="32" y2="8" stroke="#1AA6B3" stroke-width="1.6"></line>
        <line x1="20" y1="20" x2="8" y2="32" stroke="#1AA6B3" stroke-width="1.6"></line>
        <line x1="20" y1="20" x2="32" y2="32" stroke="#1AA6B3" stroke-width="1.6"></line>
        <circle cx="20" cy="20" r="5.5" fill="#0E2A44"></circle>
        <circle cx="8" cy="8" r="3" fill="#B5730C"></circle>
        <circle cx="32" cy="8" r="3" fill="#1AA6B3"></circle>
        <circle cx="8" cy="32" r="3" fill="#1AA6B3"></circle>
        <circle cx="32" cy="32" r="3" fill="#B5730C"></circle>
      </svg>
      <div style="line-height:1.2;">
        <b style="font-size:16px; color:#0E2A44; letter-spacing:0.01em;">VAACA</b>
        <div style="font-size:10.5px; color:#6B7680; letter-spacing:0.02em;">Virtual Assets Association of Central Africa</div>
      </div>
    </a>
    <div role="navigation" aria-label="Primary" class="vaaca-navlinks" style="display:flex; gap:20px; font-size:13.5px; font-weight:500; align-items:center; flex-wrap:wrap;">
      <a href="./VAACA Institution.dc.html" style="text-decoration:none; color:{{ colors.institution }}; font-weight:{{ weights.institution }}; padding-bottom:4px; border-bottom:2px solid {{ underline.institution }};" style-hover="color:#1AA6B3;">Institution</a>
      <a href="./VAACA Standards.dc.html" style="text-decoration:none; color:{{ colors.standards }}; font-weight:{{ weights.standards }}; padding-bottom:4px; border-bottom:2px solid {{ underline.standards }};" style-hover="color:#1AA6B3;">Standards</a>
      <a href="./VAACA Ecosystem.dc.html" style="text-decoration:none; color:{{ colors.ecosystem }}; font-weight:{{ weights.ecosystem }}; padding-bottom:4px; border-bottom:2px solid {{ underline.ecosystem }};" style-hover="color:#1AA6B3;">Ecosystem</a>
      <a href="./VAACA Membership.dc.html" style="text-decoration:none; color:{{ colors.membership }}; font-weight:{{ weights.membership }}; padding-bottom:4px; border-bottom:2px solid {{ underline.membership }};" style-hover="color:#1AA6B3;">Membership</a>
      <a href="./VAACA Governance.dc.html" style="text-decoration:none; color:{{ colors.governance }}; font-weight:{{ weights.governance }}; padding-bottom:4px; border-bottom:2px solid {{ underline.governance }};" style-hover="color:#1AA6B3;">Governance</a>
      <a href="./VAACA Region.dc.html" style="text-decoration:none; color:{{ colors.region }}; font-weight:{{ weights.region }}; padding-bottom:4px; border-bottom:2px solid {{ underline.region }};" style-hover="color:#1AA6B3;">Region</a>
      <a href="./VAACA Resources.dc.html" target="_blank" rel="noopener" style="text-decoration:none; color:#33393E;" style-hover="color:#1AA6B3;">Resources</a>
      <a href="./VAACA Login.dc.html" target="_blank" rel="noopener" style="text-decoration:none; color:#33393E;" style-hover="color:#1AA6B3;">Login</a>
      <a href="./CAVAA Operating System.dc.html" target="_blank" rel="noopener" style="text-decoration:none; background:#0E2A44; color:#fff; padding:9px 16px; border-radius:6px; font-weight:600;" style-hover="background:#1AA6B3;">Operating System ↗</a>
    </div>
    <button aria-label="Toggle menu" aria-expanded="{{ navOpen }}" onClick="{{ toggleNav }}" class="vaaca-hamburger" style="align-items:center; justify-content:center; width:38px; height:38px; border:1px solid #E3E3DD; border-radius:8px; background:#fff; cursor:pointer; padding:0;">
      <svg width="18" height="14" viewBox="0 0 18 14" fill="none"><path d="M1 1h16M1 7h16M1 13h16" stroke="#0E2A44" stroke-width="1.6" stroke-linecap="round"></path></svg>
    </button>
  </div>
  <sc-if value="{{ navOpen }}" hint-placeholder-val="{{ false }}">
    <div class="vaaca-navlinks" style="display:flex !important; flex-direction:column; gap:2px; padding:8px 20px 16px; border-top:1px solid #E3E3DD;">
      <a href="./VAACA Institution.dc.html" style="text-decoration:none; color:#33393E; padding:10px 4px; font-size:14px; font-weight:500;">Institution</a>
      <a href="./VAACA Standards.dc.html" style="text-decoration:none; color:#33393E; padding:10px 4px; font-size:14px; font-weight:500;">Standards</a>
      <a href="./VAACA Ecosystem.dc.html" style="text-decoration:none; color:#33393E; padding:10px 4px; font-size:14px; font-weight:500;">Ecosystem</a>
      <a href="./VAACA Membership.dc.html" style="text-decoration:none; color:#33393E; padding:10px 4px; font-size:14px; font-weight:500;">Membership</a>
      <a href="./VAACA Governance.dc.html" style="text-decoration:none; color:#33393E; padding:10px 4px; font-size:14px; font-weight:500;">Governance</a>
      <a href="./VAACA Region.dc.html" style="text-decoration:none; color:#33393E; padding:10px 4px; font-size:14px; font-weight:500;">Region</a>
      <a href="./VAACA Resources.dc.html" target="_blank" rel="noopener" style="text-decoration:none; color:#33393E; padding:10px 4px; font-size:14px; font-weight:500;">Resources</a>
      <a href="./VAACA Login.dc.html" target="_blank" rel="noopener" style="text-decoration:none; color:#33393E; padding:10px 4px; font-size:14px; font-weight:500;">Login</a>
      <a href="./CAVAA Operating System.dc.html" target="_blank" rel="noopener" style="text-decoration:none; background:#0E2A44; color:#fff; padding:10px 14px; border-radius:6px; font-weight:600; margin-top:8px; text-align:center;">Operating System ↗</a>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;active&quot;:{&quot;editor&quot;:null,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { scrolled: false, navOpen: false };
  componentDidMount() {
    this._onScroll = () => this.setState(s => s.scrolled === window.scrollY > 8 ? null : { scrolled: window.scrollY > 8 });
    window.addEventListener('scroll', this._onScroll, { passive: true });
  }
  componentWillUnmount() { window.removeEventListener('scroll', this._onScroll); }
  toggleNav = () => this.setState(s => ({ navOpen: !s.navOpen }));
  renderVals() {
    const active = this.props.active || '';
    const base = '#33393E', on = '#0E2A44';
    const keys = ['institution','standards','ecosystem','membership','governance','region'];
    const colors = {}, weights = {}, underline = {};
    keys.forEach(k => { colors[k] = active === k ? on : base; weights[k] = active === k ? 600 : 500; underline[k] = active === k ? '#1AA6B3' : 'transparent'; });
    return {
      navOpen: this.state.navOpen, toggleNav: this.toggleNav,
      colors, weights, underline,
      navBarStyle: `position:sticky; top:0; z-index:50; background:rgba(250,250,248,${this.state.scrolled ? '0.97' : '0.9'}); backdrop-filter:blur(6px); border-bottom:1px solid ${this.state.scrolled ? '#E3E3DD' : 'transparent'}; box-shadow:${this.state.scrolled ? '0 6px 20px -14px rgba(14,42,68,0.35)' : 'none'}; transition:box-shadow .2s, border-color .2s;`,
    };
  }
}
</script>
</body>
</html>
